[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chapter-writer"
version = "0.1.0"
description = "Graph-based Markdown authoring skill: a persistent knowledge graph that acts as a semantic index and context-management layer for Markdown documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "chapter-writer contributors" }]
keywords = ["markdown", "knowledge-graph", "authoring", "retrieval", "skill"]
dependencies = [
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "ladybug>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
chapter-writer = "chapter_writer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
